<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <script src="../components/FooterComponent.js" defer></script>
    <script src="../components/HeaderComponent.js" defer></script>
    <script src="../components/CardComponent.js" defer></script>
    <script src="../components/cardContainer.js" defer></script>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="../assets/img/logo.png" />
    <title>Informatik'Mans</title>
</head>
<body>
<header-component></header-component>
<main role="main">
    <card-container cardTitle="Contactez-nous" imageUrl="../assets/img/contact-us.png" layout="left">
        <div class='contact-form'>
            <p>Nom</p>
            <input type='text' name='name' placeholder='Votre nom' required>
            <p>Email</p>
            <input type='email' name='email' placeholder='Votre email' required>
            <p>Message</p>
            <textarea name='message' placeholder='Votre message' required></textarea>
            <button>Envoyer</button>
        </div>
    </card-container>
</main>
<footer-component></footer-component>
</body>
</html>

<style>
    @import '../styles/variables.css';

    body, html {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header-component {
        display: block;
        height: 60px; /* Hauteur fixe */
        width: 100%;
        position: fixed; /* Fixé en haut de la page */
        top: 0;
        left: 0;
        z-index: 1000; /* S'assurer qu'il est au-dessus des autres contenus */
    }


    card-container {
        margin: auto;
    }


    /* Styles pour les grands écrans */
    @media (min-width: 768px) {
        main {
            flex: 1;
            padding-top: 7rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        card-container {
            margin: auto;
        }
    }

    /* Styles pour les écrans moyens */
    @media (min-width: 480px) and (max-width: 767px) {
        main {
            flex: 1;
            padding-top: 70px; /* Correspond à la hauteur du header-component */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        card-container {
            width: 90%;
            max-width: 800px;
        }
    }

    .contact-form {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        padding: 1em;
        text-align: left;
        margin: auto;
    }

    .contact-form label {
        font-size: 1rem;
        margin-bottom: 0.5em;
    }

    .contact-form input,
    .contact-form textarea {
        padding: 0.8em;
        margin: 0.4em 0;
        border-radius: 1rem;
        border: 1px solid var(--primary-color);
        font-size: 1rem;
        box-sizing: border-box;
    }

    .contact-form textarea {
        resize: vertical;
        min-height: 150px;
        max-height: 300px; /* Définir une hauteur maximale */
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
        outline: none;
        border-color: var(--color-button);
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
    }

    /* Styles pour les petits écrans */
    @media (max-width: 479px) {
        main {
            flex: 1;
            padding-top: 70px; /* Correspond à la hauteur du header-component */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        card-container {
            padding: 2rem; /* Ajustez cette valeur selon vos besoins */
        }

        .contact-form input,
        .contact-form textarea,
        button {
            font-size: 1rem;
        }
    }

</style>
