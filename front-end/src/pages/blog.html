<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <script src="../components/FooterComponent.js" defer></script>
    <script src="../components/HeaderComponent.js" defer></script>
    <script src="../components/CardComponent.js" defer></script>
    <script src="../components/cardContainer.js" defer></script>
    <link rel="shortcut icon" type="image/x-icon" href="../assets/img/logo.png" />
    <link rel="stylesheet" href="../styles/style.css">
    <title>Informatik'Mans - Blog</title>
</head>
<body>
<header-component></header-component>
<main>
    <section id="blog">
        <h1>Blog</h1>
        <div id="post-list" class="card-container">
            <!-- Les articles de blog seront ajoutés ici via JavaScript -->
        </div>
    </section>
</main>
<footer-component></footer-component>

<script>
    function loadPosts() {
        fetch('http://127.0.0.1:3001/articles/posts', { credentials: 'include' })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.statusText);
                }
                return response.json();
            })
            .then(posts => {
                const postList = document.getElementById('post-list');
                postList.innerHTML = ''; // Clear any existing posts

                posts.forEach(post => {
                    let postItem = document.createElement('article');
                    postItem.className = 'card';

                    const imageUrl = `http://127.0.0.1:3001${post.imageUrl}`;

                    postItem.innerHTML = `
                        <img src="${imageUrl}" alt="${post.title}" class="post-image">
                        <div class="card-content">
                            <h3>${post.title}</h3>
                            <p>${post.content}</p>
                        </div>
                    `;
                    postList.appendChild(postItem);
                });
            })
            .catch(error => {
                console.error('Erreur:', error);
                const postList = document.getElementById('post-list');
                postList.innerHTML = '<p>Une erreur est survenue lors du chargement des articles.</p>';
            });
    }


    document.addEventListener('DOMContentLoaded', loadPosts);
</script>
</body>
</html>

<style>
    /* style.css */
    @import '../styles/variables.css';

    body, html {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    main {
        padding: 7rem 2rem 2rem;
        flex: 1;
    }

    h1 {
        text-align: center;
        color: var(--primary-color);
        margin-bottom: 20px;
    }

    .card-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        gap: 20px;
    }

    .card {
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        overflow: hidden;
        transition: transform 0.2s;
        width: calc(33% - 20px);
    }

    .card:hover {
        transform: translateY(-10px);
    }

    .post-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .card-content {
        padding: 15px;
    }

    .card-content h3 {
        margin: 0 0 10px;
        color: var(--primary-color);
    }

    .card-content p {
        margin: 0;
        color: #555;
    }

    @media (max-width: 768px) {
        .card {
            width: calc(50% - 20px);
        }
    }

    @media (max-width: 480px) {
        .card {
            width: 100%;
        }
    }
</style>
